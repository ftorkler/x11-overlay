name: CI Build

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'include/**'
      - 'src/**'
      - 'Makefile'
  pull_request:
    branches: [ main ]
    paths:
      - '.github/workflows/build.yml'
      - 'include/**'
      - 'src/**'
      - 'Makefile'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: install dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxfixes-dev libxrandr-dev libxft-dev libfreetype-dev

      - name: build
        run: make

      - name: run tests
        run: ./bin/run_tests
